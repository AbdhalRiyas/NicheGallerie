name: shop
description: Mobile app for woocommerce

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # COMMON
  nb_utils: ^7.0.8
  form_field_validator: ^1.1.0
  cached_network_image: ^3.4.1
  # flutter_rating_bar: ^4.0.1
  flutter_widget_from_html_core: ^0.15.2
  animations: ^2.0.11
  url_launcher: ^6.3.1
  http: ^1.2.2
  flutter_dotenv: ^5.2.1
  mobkit_dashed_border: ^0.0.7
  # country_code_picker: ^3.1.0
  # csc_picker:
  #   git:
  #       url: https://github.com/Witsberry/csc_picker.git
  #       ref: 6cc8dc6
  go_router: ^14.6.1
  intl: ^0.20.1
  quickalert: ^1.1.0
  loading_animation_widget: ^1.3.0
  fpdart: ^1.1.1
  flutter_searchable_dropdown: ^2.0.0
  expressions: ^0.2.5+2

  # STATE MANAGEMENT
  provider: ^6.1.2

  # ICON
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1
  flutter_launcher_icons: "^0.14.3"

  # DB
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  lottie: ^3.3.1
  webview_flutter: ^4.13.0

  # FIREBASE
  firebase_core: ^3.11.0
  firebase_messaging: ^15.2.4
  flutter_local_notifications: ^18.0.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo/app_icon.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  remove_alpha_ios: true

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  hive_generator: ^2.0.0
  change_app_package_name: ^1.4.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/icons/
    - assets/Illustration/
    - assets/flags/
    - assets/logo/
    - assets/screens/
    - assets/lottie/

  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/montserrat/Montserrat-Regular.ttf
        - asset: assets/fonts/montserrat/Montserrat-Medium.ttf
          weight: 500
        - asset: assets/fonts/montserrat/Montserrat-Bold.ttf
          weight: 700
